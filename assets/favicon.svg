<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#07080b"/>
  <!--
    Six-point snowflake: one spoke with an outward-angled branch pair,
    repeated at 60 degree intervals. Branches point away from the centre and
    there is only one pair, so the arms stay separate at 16px favicon size.
  -->
  <g fill="none" stroke="#d4af37" stroke-width="2.6" stroke-linecap="round">
    <g><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
    <g transform="rotate(60 32 32)"><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
    <g transform="rotate(120 32 32)"><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
    <g transform="rotate(180 32 32)"><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
    <g transform="rotate(240 32 32)"><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
    <g transform="rotate(300 32 32)"><path d="M32 32V11M32 20l-5.5-5.5M32 20l5.5-5.5"/></g>
  </g>
</svg>
